[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["davlgd"]
repository = "https://github.com/davlgd/biscuit-ssh"
description = "SSH access for third parties through Biscuit tokens"

[workspace.dependencies]
biscuit-ssh-core = { path = "crates/core", features = ["api"] }
biscuit-ssh-ca = { path = "crates/ca" }
biscuit-ssh-service = { path = "crates/service" }
# `datalog-macro` is unused but biscuit-auth 6.0.0 fails to build without it.
biscuit-auth = { version = "6.0.0", default-features = false, features = ["datalog-macro", "pem"] }
ssh-key = { version = "0.6.7", features = ["ed25519", "getrandom"] }
thiserror = "2.0.21"
anyhow = "1.0.104"
axum = "0.8.9"
# TLS through rustls with the ring provider, like the client.
axum-server = { version = "0.8.0", features = ["tls-rustls-no-provider"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal", "net"] }
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ureq = { version = "3.4.2", features = ["json"] }
bytes = "1.12.1"
# SSH server and client of the bastion, on ring like the rest of the workspace.
russh = { version = "0.63.3", default-features = false, features = ["ring", "rsa"] }
rpassword = "7.5.4"
